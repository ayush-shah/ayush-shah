name: Update profile PR cards

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public PR counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_stats.py
      - name: Commit changed cards
        run: |
          if git diff --quiet -- assets/open-source-impact.svg assets/merged-pr-activity.svg assets/profile-stats.json; then
            echo 'No card changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/open-source-impact.svg assets/merged-pr-activity.svg assets/profile-stats.json
          git commit -m 'Refresh public PR profile cards'
          git push
